name: verify
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      # The HTTP layer is only believed once something has actually answered a
      # request with a session, a refusal and an audit line.
      - run: node scripts/smoke.js

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ccabb8546106706886922008d74fbb866f1427c6 # v2.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/check-sanitised.sh
